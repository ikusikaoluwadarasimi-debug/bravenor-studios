
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | BRAVENOR STUDIOS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .thank-you {
            max-width: 650px;
        }

        .logo {
            font-size: 20px;
            letter-spacing: 4px;
            margin-bottom: 65px;
        }

        .logo span {
            color: #888;
        }

        .tag {
            color: #999;
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 75px);
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .message {
            color: #aaa;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        a {
            display: inline-block;
            padding: 16px 30px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        a:hover {
            background: #bbb;
            transform: translateY(-3px);
        }

        .footer {
            color: #666;
            font-size: 12px;
            margin-top: 80px;
        }
    </style>
</head>

<body>
    <main class="thank-you">

        <div class="logo">
            BRAVENOR<span> STUDIOS.</span>
        </div>

        <p class="tag">MESSAGE RECEIVED</p>

        <h1>THANK YOU.</h1>

        <p class="message">
            Your enquiry has been received successfully.
            We appreciate your interest in BRAVENOR STUDIOS.
            We'll be in touch soon.
        </p>

        <a href="index.html">BACK TO HOME →</a>

        <p class="footer">
            © 2026 BRAVENOR STUDIOS. All rights reserved.
        </p>

    </main>
</body>
</html>
